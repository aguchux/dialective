name: Prisma build and migrate

on:
  push:
    branches: [main]
    paths:
      - "services/api/prisma/**"
      - "services/api/src/**"
      - "services/api/package.json"
      - ".github/workflows/prisma-migrate.yml"
  pull_request:
    paths:
      - "services/api/prisma/**"
      - "services/api/src/**"
      - "services/api/package.json"
      - ".github/workflows/prisma-migrate.yml"
  workflow_dispatch:

concurrency:
  group: prisma-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prisma:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dialective
          POSTGRES_PASSWORD: dialective
          POSTGRES_DB: dialective
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dialective -d dialective"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dialective:dialective@localhost:5432/dialective
      SHADOW_DATABASE_URL: postgresql://dialective:dialective@localhost:5432/dialective_shadow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client and build API
        run: npm run build

      - name: Create shadow database
        run: PGPASSWORD=dialective psql -h localhost -U dialective -d dialective -c "CREATE DATABASE dialective_shadow;"

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Verify production seed
        run: npm run prisma:seed

      - name: Verify schema is in sync with migrations
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

        
