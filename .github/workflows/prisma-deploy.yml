name: Deploy Prisma migrations + seed to production

# Runs two ways:
#  - workflow_call: docker-publish.yml invokes this automatically on every
#    push to main, once it has pushed a new dialect-api-prisma image -- see
#    that workflow's "prisma-deploy" job. This is the path that keeps a
#    schema change from ever landing on main without also landing in the
#    production database (this workflow's own history is the reason that
#    matters: prisma-migrate.yml's auto-triggered "Prisma build and migrate"
#    job only ever validates against a throwaway CI Postgres container and
#    reports success regardless of production state, which reads
#    deceptively like a real deploy but never was one). `prisma migrate
#    deploy` is already a safe no-op when nothing new needs applying, so
#    running this on every push costs nothing when there's no schema change.
#  - workflow_dispatch: manual escape hatch, e.g. to re-run a release
#    against an older image tag, or to seed/migrate outside the normal
#    push-to-main flow.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "dialect-api-prisma image tag (prefer a commit SHA)"
        required: true
        default: "latest"
  workflow_call:
    inputs:
      image_tag:
        description: "dialect-api-prisma image tag (prefer a commit SHA)"
        required: true
        type: string
    secrets:
      KUBE_CONFIG:
        required: true

concurrency:
  group: prisma-deploy-prod
  cancel-in-progress: false

jobs:
  migrate-and-seed:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Run Prisma release Job
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            echo "Invalid image tag: $IMAGE_TAG" >&2
            exit 1
          fi

          POSTGRES_SECRET=$(kubectl get deployment api --namespace dai \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="api")].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef.name}')
          if ! printf '%s' "$POSTGRES_SECRET" | grep -Eq '^postgres-creds-[a-z0-9]+$'; then
            echo "Could not resolve the Kustomize-generated Postgres Secret from deployment/api" >&2
            exit 1
          fi

          JOB_NAME=$(
            sed \
              -e "s|golojan/dialect-api-prisma:latest|golojan/dialect-api-prisma:${IMAGE_TAG}|" \
              -e "s|name: postgres-creds$|name: ${POSTGRES_SECRET}|" \
              k8s/jobs/prisma-release-job.yaml \
              | kubectl create --namespace dai -f - -o jsonpath='{.metadata.name}'
          )
          echo "Created $JOB_NAME with image tag $IMAGE_TAG"

          RELEASE_STATUS=""
          for _ in $(seq 1 120); do
            SUCCEEDED=$(kubectl get job "$JOB_NAME" --namespace dai -o jsonpath='{.status.succeeded}')
            FAILED=$(kubectl get job "$JOB_NAME" --namespace dai -o jsonpath='{.status.failed}')
            if [ "$SUCCEEDED" = "1" ]; then
              RELEASE_STATUS="succeeded"
              break
            fi
            if [ -n "$FAILED" ] && [ "$FAILED" -gt 2 ]; then
              RELEASE_STATUS="failed"
              break
            fi
            sleep 5
          done

          if [ "$RELEASE_STATUS" != "succeeded" ]; then
            kubectl describe job "$JOB_NAME" --namespace dai
            kubectl logs "job/$JOB_NAME" --namespace dai --all-containers=true --prefix=true || true
            echo "Prisma release ${RELEASE_STATUS:-timed out}" >&2
            exit 1
          fi

          kubectl logs "job/$JOB_NAME" --namespace dai --all-containers=true --prefix=true
