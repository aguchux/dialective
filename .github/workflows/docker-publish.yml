name: Build and push service images

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/consensus-scorer/**"
      - "services/prompt-audio-service/**"
      - "services/settlement-job/**"
      - "services/vosk-worker/**"
      - "services/whisper-worker/**"
      - "models/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # consensus-scorer/settlement-job Dockerfiles COPY relative to their
          # own service dir; api/vosk-worker/prompt-audio-service/whisper-worker
          # also COPY models/*.yaml, so they need repo-root context instead.
          - service: api
            context: .
            image: api
            target: runtime
          - service: api
            context: .
            image: api-prisma
            target: prisma-release
          - service: consensus-scorer
            context: services/consensus-scorer
            image: consensus-scorer
          - service: settlement-job
            context: services/settlement-job
            image: settlement-job
          - service: prompt-audio-service
            context: .
            image: prompt-audio-service
          - service: vosk-worker
            context: .
            image: vosk-worker
          - service: whisper-worker
            context: .
            image: whisper-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: services/${{ matrix.service }}/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            golojan/dialect-${{ matrix.image }}:latest
            golojan/dialect-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
