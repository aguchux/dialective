name: Build and push service images

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/consensus-scorer/**"
      - "services/prompt-audio-service/**"
      - "services/settlement-job/**"
      - "services/vosk-worker/**"
      - "models/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # api/consensus-scorer/settlement-job Dockerfiles COPY relative to
          # their own service dir; vosk-worker/prompt-audio-service also COPY
          # ../../models/*.yaml, so they need repo-root context instead.
          - service: api
            context: services/api
          - service: consensus-scorer
            context: services/consensus-scorer
          - service: settlement-job
            context: services/settlement-job
          - service: prompt-audio-service
            context: .
          - service: vosk-worker
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            golojan/dialect-${{ matrix.service }}:latest
            golojan/dialect-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
