name: Build and push service images

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/isvc-scorer/**"
      - "services/prompt-audio-service/**"
      - "services/settlement-job/**"
      - "services/audio-retention-job/**"
      - "services/word-generator-job/**"
      - "services/domain-conversation-prompt-job/**"
      - "services/fx-rate-job/**"
      - "services/vosk-worker/**"
      - "services/whisper-worker/**"
      - "services/quality-gate-worker/**"
      - "packages/db/**"
      - "package.json"
      - "package-lock.json"
      - "models/registry.yaml"
      - "models/asr-registry.yaml"
      - "models/tts-registry.yaml"
      - "chatdialect/apps/agent/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # All Node services (api, settlement-job) build from repo-root
          # context: they depend on the @dialectiva/db workspace package
          # (packages/db), whose generated Prisma client is produced from
          # services/api's schema during each image's own build stage --
          # see each Dockerfile's comment. The Python workers and
          # prompt-audio-service also need repo-root context to reach
          # models/*.yaml.
          - service: api
            context: .
            image: api
            target: runtime
          - service: api
            context: .
            image: api-prisma
            target: prisma-release
          - service: isvc-scorer
            context: .
            image: isvc-scorer
          - service: settlement-job
            context: .
            image: settlement-job
          - service: audio-retention-job
            context: .
            image: audio-retention-job
          - service: word-generator-job
            context: .
            image: word-generator-job
          - service: domain-conversation-prompt-job
            context: .
            image: domain-conversation-prompt-job
          - service: fx-rate-job
            context: .
            image: fx-rate-job
          - service: prompt-audio-service
            context: .
            image: prompt-audio-service
          - service: vosk-worker
            context: .
            image: vosk-worker
          - service: whisper-worker
            context: .
            image: whisper-worker
          - service: quality-gate-worker
            context: .
            image: quality-gate-worker
          # chatdialect-agent is self-contained (no @dialectiva/db or
          # models/*.yaml dependency, unlike the Dialect Library services
          # above) -- context is its own directory, not repo root. Image
          # name is golojan/dialect-chatdialect-agent, not
          # golojan/chatdialect-agent, to keep the golojan/dialect-* prefix
          # convention even though chatdialect/ is a separate product.
          - service: chatdialect-agent
            context: chatdialect/apps/agent
            image: chatdialect-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.service == 'chatdialect-agent' && 'chatdialect/apps/agent/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            golojan/dialect-${{ matrix.image }}:latest
            golojan/dialect-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # A schema change merged to main but never released to production reads
  # exactly like a working deploy -- prisma-migrate.yml's CI job only ever
  # validates against a throwaway Postgres container, and its green check
  # gives no signal about production's actual state. This job closes that
  # gap by releasing the just-built dialect-api-prisma image (pinned to this
  # commit's SHA, not :latest -- see prisma-deploy.yml's own image-tag
  # comment) against the live database automatically, on every push to main,
  # immediately after the image that would otherwise silently expect the new
  # columns is live. Runs unconditionally rather than trying to detect
  # "did this push touch prisma/" from commit metadata (github.event.commits
  # is unreliable across squash-merges/force-pushes/multi-commit pushes) --
  # `prisma migrate deploy` is already a safe no-op when there is nothing
  # new to apply, so that's the correct place to decide, not this filter.
  prisma-deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/prisma-deploy.yml
    with:
      image_tag: ${{ github.sha }}
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
