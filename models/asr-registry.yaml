# Maps dialect_tag -> which ASR engine/stream handles it. Read by api
# (routes asr-jobs at publish time -- see submissions.controller.ts) and by
# both ASR workers at startup (each only ever consumes the stream matching
# its own engine, so this file is the single source of truth both sides
# must agree on -- never hardcode a dialect_tag -> engine mapping anywhere
# else).
#
# `engine` must be "vosk" or "whisper". `stream` is the asr-jobs-<engine>
# stream api publishes to and that engine's worker consumes.
#
# If a dialect_tag has no entry here, the submission must be rejected as
# unsupported_dialect before ever reaching a worker -- never guess an engine.

en-us:
  engine: vosk
  stream: asr-jobs-vosk

ig:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: NCAIR1/Igbo-ASR

yo:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: NCAIR1/Yoruba-ASR

ha:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: NCAIR1/Hausa-ASR

nae:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: NCAIR1/NigerianAccentedEnglish

rw:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: mbazaNLP/Whisper-Small-Kinyarwanda

# Added 2026-09-20. 17 dialect_tags were in production with no entry here,
# so api attached no asr_stream, no worker ever saw them, and 82k+
# recordings (58k of them already SETTLED) carry no transcript at all. The
# skip is silent by design -- resolve() returns undefined and publishing
# just omits the route -- which is why it went unnoticed for a month.
#
# Deliberately NOT all 17 at once. These are community fine-tunes with
# three-figure download counts, not the NCAIR1 checkpoints above, so each
# needs its output judged on real audio before the next is added. Every one
# below was checked to be ungated and WhisperForConditionalGeneration (the
# only architecture worker.py's transformers pipeline can load -- the most
# downloaded pidgin model, asr-nigerian-pidgin/pidgin-wav2vec2-xlsr53, is
# Wav2Vec2ForCTC and would fail at load).
#
# Still unmapped and needing a decision: ibb (11k recordings, no public
# ASR model exists at all), am, ak, sw-ke, fr-bj, arz, af-za, en-za, nd,
# ny, st-za, zu, xh.

# 44k recordings, the single largest gap.
pcm:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: Mansa-Labs/obum-whisper-medium-nigerian-pidgin

# 14k recordings.
sn:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: Code-Dev/whisper-small-shona-v3-a