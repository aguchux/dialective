# Maps dialect_tag -> which ASR engine/stream handles it. Read by api
# (routes asr-jobs at publish time -- see submissions.controller.ts) and by
# both ASR workers at startup (each only ever consumes the stream matching
# its own engine, so this file is the single source of truth both sides
# must agree on -- never hardcode a dialect_tag -> engine mapping anywhere
# else).
#
# `engine` must be "vosk" or "whisper". `stream` is the asr-jobs-<engine>
# stream api publishes to and that engine's worker consumes.
#
# If a dialect_tag has no entry here, the submission must be rejected as
# unsupported_dialect before ever reaching a worker -- never guess an engine.

en-us:
  engine: vosk
  stream: asr-jobs-vosk

ig:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: NCAIR1/Igbo-ASR

yo:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: NCAIR1/Yoruba-ASR

ha:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: NCAIR1/Hausa-ASR

nae:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: NCAIR1/NigerianAccentedEnglish

rw:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: mbazaNLP/Whisper-Small-Kinyarwanda

# Added 2026-09-20. 17 dialect_tags were in production with no entry here,
# so api attached no asr_stream, no worker ever saw them, and 82k+
# recordings (58k of them already SETTLED) carry no transcript at all. The
# skip is silent by design -- resolve() returns undefined and publishing
# just omits the route -- which is why it went unnoticed for a month.
#
# Deliberately NOT all 17 at once. These are community fine-tunes with
# three-figure download counts, not the NCAIR1 checkpoints above, so each
# needs its output judged on real audio before the next is added.
#
# Every checkpoint here was loaded on a real whisper-worker pod before
# being added, NOT just checked on the HuggingFace API. That distinction
# matters: HF metadata reported the two most promising candidates
# (Mansa-Labs/obum-whisper-medium-nigerian-pidgin for pcm,
# Code-Dev/whisper-small-shona-v3-a for sn) as ungated
# WhisperForConditionalGeneration, and BOTH fail at load with "does not
# appear to have a file named preprocessor_config.json". A checkpoint that
# fails to load does not fail loudly here -- get_pipeline raises, the job
# is left unacknowledged, and that dialect just keeps producing no
# transcripts, i.e. the exact silent failure this whole change exists to
# end. Probe before mapping.
#
# Architecture matters too: worker.py's transformers pipeline loads
# WhisperForConditionalGeneration only. The most-downloaded pidgin model,
# asr-nigerian-pidgin/pidgin-wav2vec2-xlsr53, is Wav2Vec2ForCTC.
#
# SIZE IS A CONSTRAINT, not just availability. A worker holds each model
# it loads in RAM against a 3584Mi pod limit, so a checkpoint's size
# decides whether it can run at all: whisper-small is ~1GB resident and
# fine, whisper-medium is ~3GB and only one fits at a time, and a
# large-v3 at ~6GB cannot load however the cache is tuned. Check the
# checkpoint's weight files before adding it, not only that it loads on a
# probe -- the probe does not compete with an already-loaded model.
#
# Still unmapped, with why (checked 2026-09-20):
#   sn    13,749  BLOCKED ON CLUSTER MEMORY, not on the model. Its 6.17GB
#                 on HuggingFace is the same weights stored twice
#                 (.safetensors AND .bin); transformers loads one, so it is
#                 ~3.09GB resident -- the same size as zu's checkpoint,
#                 which runs fine. But a probe pod OOMKilled at a 6Gi limit
#                 and could not even schedule at a 3Gi request ("0/5 nodes
#                 available: Insufficient memory"). The five DO nodes are
#                 66-96% memory-requested. Needs a node added before this
#                 can be mapped; the checkpoint itself is fine. Fastest-
#                 growing gap: 99% of those recordings arrived in 7 days.
#   ibb   11,361  no public Ibibio ASR model exists in any format
#   af-za    272  both Afrikaans candidates fail to load (no tokenizer)
#   en-za    210  no SA-English model; en-us is the nearest fallback but
#                 accent mismatch would make asrMatchScore misleading
#   nd       162  no Ndebele model
#   ny       101  only candidate fails to load (no tokenizer)
#   ee        94  no Ewe model
#   ti-et     81  both Tigrinya candidates fail to load
#   luo       59  searches return a LAO model, not Luo -- do not map it
#   ff-cm     41  no Fulfulde model
#   yo-bj     30  Beninese Yoruba; could share yo's NCAIR1 checkpoint, but
#                 that is a judgement call on dialect distance, not a fact
#   fon       24  no Fon model
#   om        11  no Oromo model
#   fr-bj    296  French; no Beninese model, and metropolitan French ASR on
#                 Beninese speech is the same accent-mismatch problem as en-za
#
# Everything above is a genuine model-availability gap, not an oversight.
# Roughly 12.8k of the 13k uncovered recordings are Ibibio alone.

# 44k recordings, the single largest gap. Processor verified to load on
# whisper-worker-0.
pcm:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: ocansey/whisper-small-nigerian-pidgin

# 7k recordings. Verified to load on whisper-worker-0.
#
# BACKFILL WARNING (2026-09-20): this is a whisper-MEDIUM (~3GB resident)
# against a 3584Mi pod limit. It loads fine for the occasional live
# recording, but feeding it a sustained backlog alongside live pcm/yo/ig
# traffic OOMKilled all five whisper-worker pods within minutes and
# stopped live transcription entirely -- the cache cap of 1 does not help,
# because the medium model alone plus a second dialect's arrival is enough
# to cross the limit. ~260 backfill jobs were sent; 19 dead-lettered with
# max_delivery_attempts_exceeded, none produced a transcript. Recovery was
# XGROUP SETID to the stream tail plus a pod restart. Do not backfill this
# dialect (or any medium: ary, ar-dz) until the fleet has more memory
# headroom -- the same capacity wall that blocks sn.
zu:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: TheirStory/whisper-medium-zulu

# 1.4k recordings. Verified to load on whisper-worker-0.
xh:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: TheirStory/whisper-small-xhosa

# 1.4k recordings.
am:
  engine: whisper
  stream: asr-jobs-whisper
  checkpoint: chappM/whisper-amharic-small-v2

# 957 recordings. st-za and st are both Sesotho and share a checkpoint --
