apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dai

resources:
  - namespace.yaml
  - ../../base

# Copy each secrets/*.env.example to secrets/*.env and each
# configs/*.env.example to configs/*.env, then fill in real values — the
# real files are gitignored, only the .example files are committed. Names/
# keys here must match what k8s/base/*.yaml's secretKeyRef/configMapKeyRef
# entries expect.
secretGenerator:
  - name: postgres-creds
    envs:
      - secrets/postgres.env
  - name: spaces-creds
    envs:
      - secrets/spaces.env
  - name: pgadmin-creds
    envs:
      - secrets/pgadmin.env
  - name: auth-creds
    envs:
      - secrets/auth.env
  - name: hf-creds
    envs:
      - secrets/hf.env
  - name: nowpayments-creds
    envs:
      - secrets/nowpayments.env
  - name: flutterwave-creds
    envs:
      - secrets/flutterwave.env
  - name: flutterwave-v4-creds
    envs:
      - secrets/flutterwave-v4.env
  - name: payout-crypto-creds
    envs:
      - secrets/payout-crypto.env
  - name: didit-creds
    envs:
      - secrets/didit.env
  - name: kyc-crypto-creds
    envs:
      - secrets/kyc-crypto.env
  - name: llm-creds
    envs:
      - secrets/llm.env
  - name: sms-creds
    envs:
      - secrets/sms.env
  - name: livekit-creds
    envs:
      - secrets/livekit.env
  - name: stream-creds
    envs:
      - secrets/stream.env
  - name: rabbitmq-creds
    envs:
      - secrets/rabbitmq.env
  - name: discourse-postgres-creds
    envs:
      - secrets/discourse-postgres.env
  - name: discourse-creds
    envs:
      - secrets/discourse.env

configMapGenerator:
  - name: api-config
    envs:
      - configs/api.env
  - name: vosk-worker-config
    envs:
      - configs/vosk-worker.env
  - name: whisper-worker-config
    envs:
      - configs/whisper-worker.env
  - name: quality-gate-worker-config
    envs:
      - configs/quality-gate-worker.env
  - name: prompt-audio-service-config
    envs:
      - configs/prompt-audio-service.env
  - name: isvc-scorer-config
    envs:
      - configs/isvc-scorer.env
  - name: audio-retention-job-config
    envs:
      - configs/audio-retention-job.env
  - name: postgres-config
    envs:
      - configs/postgres.env
  - name: pgadmin-config
    envs:
      - configs/pgadmin.env
  - name: chatdialect-agent-config
    envs:
      - configs/chatdialect-agent.env
  - name: discourse-postgres-config
    envs:
      - configs/discourse-postgres.env
  - name: discourse-config
    envs:
      - configs/discourse.env
