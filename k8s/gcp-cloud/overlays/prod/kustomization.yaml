apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dai

resources:
  - namespace.yaml
  - ../../base

# Same secretGenerator/configMapGenerator pattern as
# ../../../overlays/prod/kustomization.yaml: copy each secrets/*.env.example
# to secrets/*.env and configs/*.env.example to configs/*.env, gitignored,
# fill in real values. redis-tls-ca and postgres-tls-ca are NOT listed here
# -- they hold cert files, not key=value env lines, and are created
# directly via `kubectl create secret generic --from-file` (see their
# .env.example files for the exact commands) rather than through
# kustomize's secretGenerator.
secretGenerator:
  - name: postgres-creds
    envs:
      - secrets/postgres.env
  - name: spaces-creds
    envs:
      - secrets/spaces.env
  # No hash suffix: also referenced literally by KEDA's TriggerAuthentication
  # (vosk-worker-keda.yaml's authenticationRef) -- see the matching note in
  # ../../../overlays/prod/kustomization.yaml for why a hashed name here
  # broke every ScaledObject on the DO side.
  - name: redis-auth
    envs:
      - secrets/redis-auth.env
    options:
      disableNameSuffixHash: true
  # Added alongside whisper-worker on 2026-09-14 -- see whisper-worker-
  # statefulset.yaml's comment. Only the single key each secret actually
  # needs (see secrets/auth.env.example, secrets/hf.env.example), not DO's
  # full auth.env/hf.env files.
  - name: auth-creds
    envs:
      - secrets/auth.env
  - name: hf-creds
    envs:
      - secrets/hf.env

configMapGenerator:
  - name: vosk-worker-config
    envs:
      - configs/vosk-worker.env
  - name: quality-gate-worker-config
    envs:
      - configs/quality-gate-worker.env
  - name: whisper-worker-config
    envs:
      - configs/whisper-worker.env
