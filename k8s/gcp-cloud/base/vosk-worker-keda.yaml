# Same shape as ../../base/vosk-worker-keda.yaml, pointed at the external
# redis-external address instead of the DO-cluster-internal DNS name --
# same stream/consumerGroup names, so this scaler and DO's scaler are just
# two more consumers competing for the same lag signal on the same queue.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vosk-worker-scaler
spec:
  scaleTargetRef:
    name: vosk-worker
  minReplicaCount: 0
  maxReplicaCount: 15
  cooldownPeriod: 120
  pollingInterval: 15
  triggers:
    - type: redis-streams
      metadata:
        address: REPLACE_WITH_REDIS_EXTERNAL_HOST:6380
        stream: asr-jobs-vosk
        consumerGroup: asr-workers-vosk
        lagCount: "1"
        activationLagCount: "0"
        tls: enable
        unsafeSsl: "true" # self-signed cert -- see redis-tls.env.example
      authenticationRef:
        name: redis-trigger-auth
