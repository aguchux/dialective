# GCP-hosted twin of ../../base/quality-gate-worker-deployment.yaml -- same
# image, same consumer group, no PVC/initContainer needed (the liveness
# classifier is a KB-scale joblib artifact baked into the image). Added
# alongside vosk-worker on 2026-09-14 because DO's quality-gate-worker was
# capped at its ScaledObject's maxReplicaCount (15) with a 30k+ entry lag in
# quality-gate-jobs after being found paused (autoscaling.keda.sh/paused-
# replicas, applied manually out-of-band, unrelated to this deployment) --
# GCP adds real additional capacity against the same shared stream/consumer
# group, the same way vosk-worker does for asr-jobs-vosk.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quality-gate-worker
  labels:
    app: quality-gate-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: quality-gate-worker
  template:
    metadata:
      labels:
        app: quality-gate-worker
    spec:
      containers:
        - name: quality-gate-worker
          image: golojan/dialect-quality-gate-worker:latest
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: quality-gate-worker-config
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: quality-gate-worker-config
                  key: redis_port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: REDIS_TLS
              value: "true"
            - name: REDIS_TLS_CA
              value: /redis-tls/ca.crt
            - name: QUALITY_GATE_STREAM
              valueFrom:
                configMapKeyRef:
                  name: quality-gate-worker-config
                  key: quality_gate_stream
            - name: CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: quality-gate-worker-config
                  key: consumer_group
            # Marks this cluster's consumers in the shared group on DO's
            # Redis. A Deployment's pod names carry a ReplicaSet hash so an
            # exact cross-cluster collision is unlikely (unlike the whisper
            # StatefulSet's ordinals), but the prefix makes XINFO CONSUMERS
            # readable by origin and removes the possibility entirely.
            - name: CONSUMER_PREFIX
              value: "gcp-"
            - name: SPACES_REGION
              valueFrom:
                configMapKeyRef:
                  name: quality-gate-worker-config
                  key: spaces_region
            - name: SPACES_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: endpoint
            - name: SPACES_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: access_key
            - name: SPACES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: secret_key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: connection_string
          # Same values as ../../base/quality-gate-worker-deployment.yaml --
          # see that file's comment. Also needed here so GKE's cluster
          # autoscaler has something to measure pressure against and can
          # actually add nodes (up to the node pool's max-nodes=3) as
          # replicas scale up, instead of overpacking the single existing
          # node the way DO did before requests were set.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-tls-ca
              mountPath: /redis-tls
              readOnly: true
            - name: postgres-tls-ca
              mountPath: /postgres-tls
              readOnly: true
      volumes:
        - name: redis-tls-ca
          secret:
            secretName: redis-tls-ca
        - name: postgres-tls-ca
          secret:
            secretName: postgres-tls-ca
