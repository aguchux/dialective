# GCP-hosted twin of ../../base/whisper-worker-statefulset.yaml -- same
# image, same consumer group over DO's shared Redis (asr-jobs-whisper /
# asr-workers-whisper), so this and DO's StatefulSet are just two more
# consumers competing for the same lag signal on the same queue. Added
# 2026-09-14 because DO's whisper-worker was capped at its ScaledObject's
# maxReplicaCount (5) with a ~29k entry lag in asr-jobs-whisper -- GCP adds
# real additional capacity, the same way vosk-worker/quality-gate-worker
# already do for their own streams.
#
# Own per-pod PVC via volumeClaimTemplates (RWO -- same reasoning as DO's
# do-block-storage: a shared PVC can only attach to one pod's node at a time,
# so each replica needs its own HuggingFace Hub download cache under /models,
# cold on first boot and warm afterward).
#
# `standard` (pd-standard), NOT the cluster-default `standard-rwo`
# (pd-balanced). pd-balanced counts against SSD_TOTAL_GB, and in us-central1
# that quota is 300GB -- exactly consumed by the three 100GB pd-balanced node
# boot disks, leaving zero headroom. A pd-balanced PVC of ANY size therefore
# fails with QUOTA_EXCEEDED and the pod sits Pending forever (it did, for
# 2d8h). pd-standard draws on DISKS_TOTAL_GB instead, which is 2458GB and
# nearly empty. Don't "upgrade" this back to standard-rwo without first
# raising SSD_TOTAL_GB or shrinking the node boot disks.
#
# 30Gi, raised from 8Gi on 2026-09-20 alongside DO's -- see that file for
# the full reasoning. asr-registry.yaml went from 3 whisper checkpoints to
# 14 and the models now total ~22GB on disk, so a worker that caches every
# checkpoint it is asked for no longer fits in 8Gi. An out-of-space /models
# breaks the next download, including for dialects that work today.
apiVersion: v1
kind: Service
metadata:
  name: whisper-worker
  labels:
    app: whisper-worker
spec:
  clusterIP: None
  selector:
    app: whisper-worker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: whisper-worker
  labels:
    app: whisper-worker
spec:
  serviceName: whisper-worker
  # KEDA (whisper-worker-keda.yaml) drives replica count 0-5 off Redis
  # stream lag; this is just the floor when nothing has scaled it yet.
  replicas: 0
  selector:
    matchLabels:
      app: whisper-worker
  template:
    metadata:
      labels:
        app: whisper-worker
    spec:
      containers:
        - name: whisper-worker
          image: golojan/dialect-whisper-worker:latest
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: whisper-worker-config
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: whisper-worker-config
                  key: redis_port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: REDIS_TLS
              value: "true"
            - name: REDIS_TLS_CA
              value: /redis-tls/ca.crt
            - name: ASR_STREAM
              valueFrom:
                configMapKeyRef:
                  name: whisper-worker-config
                  key: asr_stream
            - name: CONSENSUS_STREAM
              valueFrom:
                configMapKeyRef:
                  name: whisper-worker-config
                  key: consensus_stream
            - name: CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: whisper-worker-config
                  key: consumer_group
            # This StatefulSet produces the same pod names as DO's
            # (whisper-worker-0, -1, ...) while both consume the SAME group on
            # DO's Redis, and Redis identifies a consumer by name alone --
            # so without this the two clusters' pod 0 are one consumer and
            # each can xautoclaim entries the other is still working on.
            # Literal rather than configMap: it identifies the cluster, not a
            # tunable.
            - name: CONSUMER_PREFIX
              value: "gcp-"
            - name: SPACES_REGION
              valueFrom:
                configMapKeyRef:
                  name: whisper-worker-config
                  key: spaces_region
            - name: SPACES_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: endpoint
            - name: SPACES_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: access_key
            - name: SPACES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: secret_key
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-creds
                  key: hf_token
            - name: API_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-creds
                  key: api_token_encryption_key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: connection_string
          # Same figures as DO's -- see that file's comment (the 2026-08-23
          # eviction incident). GKE's cluster autoscaler needs these set to
          # add nodes as replicas scale up, same reasoning as
          # quality-gate-worker-deployment.yaml's requests here.
          resources:
            requests:
              cpu: 500m
              memory: 2560Mi
            limits:
              cpu: "2"
              memory: 3584Mi
          volumeMounts:
            - name: whisper-model-repo
              mountPath: /models
              readOnly: false
            - name: redis-tls-ca
              mountPath: /redis-tls
              readOnly: true
            - name: postgres-tls-ca
              mountPath: /postgres-tls
              readOnly: true
      volumes:
        - name: redis-tls-ca
          secret:
            secretName: redis-tls-ca
        - name: postgres-tls-ca
          secret:
            secretName: postgres-tls-ca
  volumeClaimTemplates:
    - metadata:
        name: whisper-model-repo
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 30Gi
        storageClassName: standard
