apiVersion: apps/v1
kind: Deployment
metadata:
  name: prompt-audio-service
  labels:
    app: prompt-audio-service
spec:
  replicas: 0
  selector:
    matchLabels:
      app: prompt-audio-service
  template:
    metadata:
      labels:
        app: prompt-audio-service
    spec:
      containers:
        - name: prompt-audio-service
          image: golojan/dialect-prompt-audio-service:latest
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: prompt-audio-service-config
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: prompt-audio-service-config
                  key: redis_port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: PROMPT_AUDIO_STREAM
              valueFrom:
                configMapKeyRef:
                  name: prompt-audio-service-config
                  key: prompt_audio_stream
            - name: CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: prompt-audio-service-config
                  key: consumer_group
            - name: SPACES_REGION
              valueFrom:
                configMapKeyRef:
                  name: prompt-audio-service-config
                  key: spaces_region
            - name: SPACES_PROMPT_AUDIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: prompt-audio-service-config
                  key: spaces_prompt_audio_bucket
            - name: SPACES_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: endpoint
            - name: SPACES_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: access_key
            - name: SPACES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: secret_key
          volumeMounts:
            - name: tts-model-repo
              mountPath: /models
              readOnly: false
          # Explicit sizing so this is Burstable, not BestEffort -- an unsized
          # container is the first thing the kernel OOM-kills under node memory
          # pressure, and this node pool is shared with the unrelated `bitocard`
          # namespace. See api-deployment.yaml for the incident this came from.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: tts-model-repo
          persistentVolumeClaim:
            claimName: tts-model-repo-pvc
