apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  labels:
    app: rabbitmq
data:
  rabbitmq.conf: |
    # Plain AMQP (5672) remains cluster-internal only, exactly as before --
    # every in-cluster client (api, workers) keeps connecting the same way.
    # The TLS listener (5671) is additive, for rabbitmq-external.yaml's
    # LoadBalancer only (GCP's api pod, same posture as redis-external.yaml/
    # postgres-external.yaml: password+TLS+allowlist for anything that
    # leaves the cluster). The management UI is exposed only through the
    # TLS ingress in rabbitmq-ingress.yaml.
    loopback_users.guest = false
    management.tcp.port = 15672
    vm_memory_high_watermark.relative = 0.6
    disk_free_limit.absolute = 1GB
    log.console = true
    log.console.level = info
    listeners.tcp.default = 5672
    listeners.ssl.default = 5671
    ssl_options.certfile = /rabbitmq-tls-runtime/tls.crt
    ssl_options.keyfile = /rabbitmq-tls-runtime/tls.key
    ssl_options.verify = verify_none
    ssl_options.fail_if_no_peer_cert = false
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  labels:
    app: rabbitmq
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: amqp-tls
      port: 5671
      targetPort: amqp-tls
    - name: management
      port: 15672
      targetPort: management
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-management
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: http
      port: 15672
      targetPort: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        tier: backend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: rabbitmq
          # Pin to a supported release instead of a floating major/latest tag.
          image: rabbitmq:4.3.5-management
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: amqp-tls
              containerPort: 5671
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-creds
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-creds
                  key: password
            - name: RABBITMQ_DEFAULT_VHOST
              value: /dialectiva
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
              readOnly: true
            - name: rabbitmq-tls-runtime
              mountPath: /rabbitmq-tls-runtime
              readOnly: true
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      initContainers:
        # Same fix-perms pattern as postgres.yaml's fix-tls-perms -- a
        # Secret volume's file mode can't be forced to the 0600 RabbitMQ's
        # embedded erlang TLS stack expects, so copy into an emptyDir and
        # chmod there instead of mounting the Secret directly.
        - name: fix-tls-perms
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              cp /rabbitmq-tls/tls.crt /rabbitmq-tls-runtime/tls.crt
              cp /rabbitmq-tls/tls.key /rabbitmq-tls-runtime/tls.key
              chmod 600 /rabbitmq-tls-runtime/tls.key
              chown 999:999 /rabbitmq-tls-runtime/tls.key /rabbitmq-tls-runtime/tls.crt
          volumeMounts:
            - name: rabbitmq-tls
              mountPath: /rabbitmq-tls
              readOnly: true
            - name: rabbitmq-tls-runtime
              mountPath: /rabbitmq-tls-runtime
      volumes:
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config
        - name: rabbitmq-tls
          secret:
            secretName: rabbitmq-tls
        - name: rabbitmq-tls-runtime
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
        storageClassName: do-block-storage
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rabbitmq
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: rabbitmq
---
# Requires a NetworkPolicy-capable CNI. AMQP is available only to workloads
# in this namespace; the management UI accepts traffic only from ingress-nginx.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-ingress
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dai
      ports:
        - protocol: TCP
          port: 5672
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 15672
