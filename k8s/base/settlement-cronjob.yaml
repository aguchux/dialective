apiVersion: batch/v1
kind: CronJob
metadata:
  name: settlement-job
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: settlement-job
              image: golojan/dialect-settlement-job:latest
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-creds
                      key: connection_string
                - name: SPACES_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: spaces-creds
                      key: endpoint
                - name: SPACES_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: spaces-creds
                      key: access_key
                - name: SPACES_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: spaces-creds
                      key: secret_key

              # Explicit sizing so this is Burstable, not BestEffort -- an unsized
              # container is the first thing the kernel OOM-kills under node memory
              # pressure, and this node pool is shared with the unrelated `bitocard`
              # namespace. See api-deployment.yaml for the incident this came from.
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 768Mi