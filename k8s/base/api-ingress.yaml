# Routed through keda-http-add-on's interceptor Service (installed in the
# keda namespace -- see k8s/gcp-cloud/README.md for the core KEDA install
# command this follows the same pattern as) instead of the `api` Service
# directly.
# The interceptor is what actually implements the HTTPScaledObject contract
# -- it buffers/holds requests and reports in-flight count while `api`
# scales, so pointing the Ingress straight at `api` would bypass scaling
# entirely and defeat api-http-scaledobject.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.dialectlibrary.com
      secretName: api-tls
  rules:
    - host: api.dialectlibrary.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keda-add-ons-http-interceptor-proxy
                port:
                  number: 8080
