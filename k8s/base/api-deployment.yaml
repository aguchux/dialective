apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: golojan/dialect-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: port
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: cors_allowed_origins
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: redis_port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: rabbitmq_host
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: rabbitmq_port
            - name: RABBITMQ_VHOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: rabbitmq_vhost
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-creds
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-creds
                  key: password
            - name: SPACES_REGION
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_region
            - name: SPACES_SUBMISSIONS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_submissions_bucket
            - name: SPACES_WORD_RECORDINGS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_word_recordings_bucket
            - name: SPACES_BLOG_MEDIA_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_blog_media_bucket
            - name: SPACES_COURSE_MEDIA_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_course_media_bucket
            - name: SPACES_MARKETING_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_marketing_bucket
            - name: SPACES_KYC_EVIDENCE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_kyc_evidence_bucket
            - name: SPACES_COMMUNITY_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_community_bucket
            # VDCL licence PDFs and certificates -- the shared bucket, under
            # the `vdcl/` key prefix. Objects are written PRIVATE: a licence
            # PDF names a real contributor, and both documents are served
            # through short-lived presigned URLs, never public-read.
            - name: SPACES_VDCL_DOCUMENTS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_vdcl_documents_bucket
            # Without this the code falls back to a 'dialectiva-testimonials'
            # default that does not exist in Spaces, so every video-testimony
            # upload PUT 404s and the browser reports a bare "Failed to fetch".
            - name: SPACES_TESTIMONY_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_testimony_bucket
            - name: SPACES_P2P_CHAT_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_p2p_chat_bucket
            - name: SPACES_PAYMENT_METHOD_LOGO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_payment_method_logo_bucket
            # Same secret google-analytics-cronjob.yaml reads -- both unset
            # is treated as "not configured yet" by AnalyticsRealtimeService
            # (logs nothing, just returns configured:false), so this can be
            # applied ahead of GCP service-account setup like the CronJob.
            - name: GOOGLE_ANALYTICS_PROPERTY_ID
              valueFrom:
                secretKeyRef:
                  name: google-analytics-creds
                  key: property_id
                  optional: true
            - name: GOOGLE_ANALYTICS_SERVICE_ACCOUNT_JSON
              valueFrom:
                secretKeyRef:
                  name: google-analytics-creds
                  key: service_account_json
                  optional: true
            - name: SPACES_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: endpoint
            - name: SPACES_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: access_key
            - name: SPACES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: secret_key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: connection_string
            - name: ACCESS_TOKEN_TTL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: access_token_ttl
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-creds
                  key: jwt_access_secret
            - name: OAUTH_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-creds
                  key: oauth_callback_secret
            - name: API_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-creds
                  key: api_token_encryption_key
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: frontend_url
            - name: STREAM_FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: stream_frontend_url
            # Where Connect speaker photo-upload links point. Optional --
            # LeadsController falls back to connect.dialectlibrary.com.
            - name: CONNECT_FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: connect_frontend_url
                  optional: true
            - name: KYC_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: kyc_app_url
            - name: STREAM_JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: stream-creds
                  key: stream_jwt_access_secret
            - name: RESEND_FROM_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: resend_from_address
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-creds
                  key: resend_api_key
            - name: GITHUB_ISSUES_TOKEN
              valueFrom:
                secretKeyRef:
                  name: auth-creds
                  key: github_issues_token
                  optional: true
            - name: GITHUB_REPOSITORY
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: github_repository
                  optional: true
            - name: TOKEN_USD_RATE
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: token_usd_rate
            - name: MIN_WITHDRAWAL_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: min_withdrawal_tokens
            - name: API_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: api_public_base_url
            - name: NOWPAYMENTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nowpayments-creds
                  key: nowpayments_api_key
            - name: NOWPAYMENTS_IPN_SECRET
              valueFrom:
                secretKeyRef:
                  name: nowpayments-creds
                  key: nowpayments_ipn_secret
            - name: NOWPAYMENTS_PAYOUT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: nowpayments-creds
                  key: nowpayments_payout_email
            - name: NOWPAYMENTS_PAYOUT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nowpayments-creds
                  key: nowpayments_payout_password
            - name: FLUTTERWAVE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flutterwave-creds
                  key: flutterwave_secret_key
            - name: FLUTTERWAVE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: flutterwave-creds
                  key: flutterwave_public_key
            - name: FLUTTERWAVE_WEBHOOK_SECRET_HASH
              valueFrom:
                secretKeyRef:
                  name: flutterwave-creds
                  key: flutterwave_webhook_secret_hash
            - name: FLUTTERWAVE_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: flutterwave-creds
                  key: flutterwave_environment
            - name: FLUTTERWAVE_V4_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: flutterwave-v4-creds
                  key: flutterwave_v4_client_id
            - name: FLUTTERWAVE_V4_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flutterwave-v4-creds
                  key: flutterwave_v4_client_secret
            - name: FLUTTERWAVE_V4_WEBHOOK_SECRET_HASH
              valueFrom:
                secretKeyRef:
                  name: flutterwave-v4-creds
                  key: flutterwave_v4_webhook_secret_hash
            - name: FLUTTERWAVE_V4_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: flutterwave-v4-creds
                  key: flutterwave_v4_base_url
            - name: PAYOUT_ACCOUNT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: payout-crypto-creds
                  key: payout_account_encryption_key
            - name: DIDIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: didit-creds
                  key: didit_api_key
            - name: DIDIT_WORKFLOW_ID
              valueFrom:
                secretKeyRef:
                  name: didit-creds
                  key: didit_workflow_id
            - name: DIDIT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: didit-creds
                  key: didit_webhook_secret
            - name: KYC_DOCUMENT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: kyc-crypto-creds
                  key: kyc_document_encryption_key
            - name: WHATSAPP_SETTINGS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: whatsapp-crypto-creds
                  key: whatsapp_settings_encryption_key
            - name: VDCL_VERIFICATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: vdcl-creds
                  key: vdcl_verification_secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-creds
                  key: openai_api_key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-creds
                  key: deepseek_api_key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-creds
                  key: anthropic_api_key
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: twilio_account_sid
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: twilio_auth_token
            - name: TWILIO_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: twilio_from_number
            - name: TERMII_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: termii_api_key
            - name: TERMII_SENDER_ID
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: termii_sender_id
            - name: TERMII_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: termii_channel
                  optional: true
            - name: AFRICASTALKING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: africastalking_api_key
            - name: AFRICASTALKING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: africastalking_username
            - name: AFRICASTALKING_SENDER_ID
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: africastalking_sender_id
            - name: SMSLIVE247_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: smslive247_api_key
            - name: SMSLIVE247_SENDER_ID
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: smslive247_sender_id
            - name: SMSLIVE247_ROUTE_ID
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: smslive247_route_id
                  optional: true
            - name: LIVEKIT_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: livekit_url
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit-creds
                  key: api_key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-creds
                  key: api_secret
          # A startupProbe is what makes the liveness settings below safe.
          # Previously liveness alone guarded boot with initialDelaySeconds 15
          # + periodSeconds 20 + failureThreshold 3, so the container was
          # killed at ~75s if /health hadn't answered. This app needs ~90s to
          # boot, so every start was a race -- pods were killed mid-boot and
          # restarted into the same race, which is how the API ended up with
          # zero ready replicas during an eviction storm.
          #
          # Liveness is suspended until this succeeds: 5s x 36 = up to 3
          # minutes to come up, then liveness takes over at its normal cadence
          # for the rest of the pod's life.
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 36
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            # 1s (the implicit default) is too tight even for this trivial
            # handler: /health returns a static object, so a timeout means the
            # event loop is blocked or the pod is CPU-starved on a busy node,
            # not that the app is broken. Killing it then makes things worse.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            # startupProbe owns the boot window now, so no initial delay here.
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Sized from measurement, not guesswork: steady state was ~680Mi
          # with a cgroup peak of 1057Mi (memory.peak inside the pod).
          #
          # This container previously declared nothing at all, which made it
          # BestEffort -- the FIRST QoS class the kernel kills under node
          # memory pressure. It duly grew past 1Gi on a node already at 63%
          # requested / 108% limits and was OOMKilled (exit 137). Without a
          # request the scheduler also can't reserve anything for it, so it
          # kept landing on nodes that had no room to give.
          #
          # requests 768Mi covers steady state so the scheduler reserves real
          # space; limits 2Gi leaves ~2x headroom over observed peak so a
          # traffic spike or a heavy report query throttles rather than dies.
          # Note this node pool is SHARED with the unrelated `bitocard`
          # namespace, so leaving dai workloads unsized means competing for
          # memory with another project's pods and losing.
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 2Gi
