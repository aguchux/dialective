apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: golojan/dialect-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: port
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: cors_allowed_origins
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: redis_port
            - name: SPACES_REGION
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_region
            - name: SPACES_SUBMISSIONS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_submissions_bucket
            - name: SPACES_WORD_RECORDINGS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_word_recordings_bucket
            - name: SPACES_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: endpoint
            - name: SPACES_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: access_key
            - name: SPACES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: secret_key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: connection_string
            - name: ACCESS_TOKEN_TTL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: access_token_ttl
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-creds
                  key: jwt_access_secret
            - name: OAUTH_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-creds
                  key: oauth_callback_secret
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: frontend_url
            - name: RESEND_FROM_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: resend_from_address
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-creds
                  key: resend_api_key
            - name: TOKEN_USD_RATE
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: token_usd_rate
            - name: MIN_WITHDRAWAL_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: min_withdrawal_tokens
            - name: COINBASE_COMMERCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: coinbase-creds
                  key: coinbase_commerce_api_key
            - name: COINBASE_COMMERCE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: coinbase-creds
                  key: coinbase_commerce_webhook_secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
