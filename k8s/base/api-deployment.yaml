apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: golojan/dialect-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: port
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: cors_allowed_origins
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: redis_port
            - name: SPACES_REGION
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_region
            - name: SPACES_SUBMISSIONS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_submissions_bucket
            - name: SPACES_WORD_RECORDINGS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_word_recordings_bucket
            - name: SPACES_BLOG_MEDIA_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_blog_media_bucket
            - name: SPACES_COURSE_MEDIA_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: spaces_course_media_bucket
            - name: SPACES_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: endpoint
            - name: SPACES_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: access_key
            - name: SPACES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: secret_key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: connection_string
            - name: ACCESS_TOKEN_TTL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: access_token_ttl
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-creds
                  key: jwt_access_secret
            - name: OAUTH_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-creds
                  key: oauth_callback_secret
            - name: API_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-creds
                  key: api_token_encryption_key
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: frontend_url
            - name: RESEND_FROM_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: resend_from_address
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-creds
                  key: resend_api_key
            - name: TOKEN_USD_RATE
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: token_usd_rate
            - name: MIN_WITHDRAWAL_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: min_withdrawal_tokens
            - name: API_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: api_public_base_url
            - name: NOWPAYMENTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nowpayments-creds
                  key: nowpayments_api_key
            - name: NOWPAYMENTS_IPN_SECRET
              valueFrom:
                secretKeyRef:
                  name: nowpayments-creds
                  key: nowpayments_ipn_secret
            - name: NOWPAYMENTS_PAYOUT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: nowpayments-creds
                  key: nowpayments_payout_email
            - name: NOWPAYMENTS_PAYOUT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nowpayments-creds
                  key: nowpayments_payout_password
            - name: FLUTTERWAVE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flutterwave-creds
                  key: flutterwave_secret_key
            - name: FLUTTERWAVE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: flutterwave-creds
                  key: flutterwave_public_key
            - name: FLUTTERWAVE_WEBHOOK_SECRET_HASH
              valueFrom:
                secretKeyRef:
                  name: flutterwave-creds
                  key: flutterwave_webhook_secret_hash
            - name: FLUTTERWAVE_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: flutterwave-creds
                  key: flutterwave_environment
            - name: PAYOUT_ACCOUNT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: payout-crypto-creds
                  key: payout_account_encryption_key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-creds
                  key: openai_api_key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-creds
                  key: deepseek_api_key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-creds
                  key: anthropic_api_key
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: twilio_account_sid
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: twilio_auth_token
            - name: TWILIO_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: twilio_from_number
            - name: TERMII_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: termii_api_key
            - name: TERMII_SENDER_ID
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: termii_sender_id
            - name: AFRICASTALKING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: africastalking_api_key
            - name: AFRICASTALKING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: africastalking_username
            - name: AFRICASTALKING_SENDER_ID
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: africastalking_sender_id
            - name: SMSLIVE247_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: smslive247_api_key
            - name: SMSLIVE247_SENDER_ID
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: smslive247_sender_id
            - name: SMSLIVE247_ROUTE_ID
              valueFrom:
                secretKeyRef:
                  name: sms-creds
                  key: smslive247_route_id
                  optional: true
            - name: LIVEKIT_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: livekit_url
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit-creds
                  key: api_key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-creds
                  key: api_secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
