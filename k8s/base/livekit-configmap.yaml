apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-server-config
data:
  # API key/secret are NOT here (ConfigMap data can't reference Secret
  # values) -- livekit-server reads them from the LIVEKIT_KEYS env var
  # instead (see livekit-deployment.yaml), sourced from the livekit-creds
  # Secret, same secretKeyRef pattern as every other worker in this
  # directory. RTC port range is deliberately narrow (10 ports, not
  # LiveKit's usual 50000-60000 default) -- see livekit-service.yaml's
  # livekit-rtc LoadBalancer, which must list each UDP port explicitly.
  livekit.yaml: |
    port: 7880
    rtc:
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 50009
      use_external_ip: true
