apiVersion: v1
kind: Service
metadata:
  name: discourse-postgres
  labels:
    app: discourse-postgres
spec:
  clusterIP: None
  selector:
    app: discourse-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: discourse-postgres
  labels:
    app: discourse-postgres
spec:
  serviceName: discourse-postgres
  replicas: 1
  selector:
    matchLabels:
      app: discourse-postgres
  template:
    metadata:
      labels:
        app: discourse-postgres
    spec:
      containers:
        # Discourse requires the pg_trgm/hstore extensions plus a specific
        # locale/collation setup that its own image bakes in -- using the
        # plain postgres:16-alpine image (like k8s/base/postgres.yaml) would
        # need manual CREATE EXTENSION work on every fresh volume. bitnami's
        # postgresql image is a normal Postgres 15 build; Discourse itself
        # creates its needed extensions on first migration as long as the
        # connecting role has CREATEDB/superuser-ish rights, which bitnami's
        # default user has within its own database.
        - name: postgres
          image: bitnami/postgresql:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: discourse-postgres-config
                  key: postgres_db
            - name: POSTGRESQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: discourse-postgres-creds
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discourse-postgres-creds
                  key: password
          volumeMounts:
            - name: discourse-postgres-data
              mountPath: /bitnami/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRESQL_USERNAME)", "-d", "$(POSTGRESQL_DATABASE)"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRESQL_USERNAME)", "-d", "$(POSTGRESQL_DATABASE)"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: discourse-postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        storageClassName: do-block-storage
