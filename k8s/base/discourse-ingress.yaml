apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: discourse
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Discourse serves large file/image uploads (avatars, attachments) --
    # nginx's default 1m body cap 413s on anything bigger.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - community.dialectlibrary.com
      secretName: discourse-tls
  rules:
    - host: community.dialectlibrary.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: discourse
                port:
                  number: 80
