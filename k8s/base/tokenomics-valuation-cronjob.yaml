apiVersion: batch/v1
kind: CronJob
metadata:
  name: tokenomics-valuation
spec:
  # Matches TokenomicsPolicy.valuationIntervalMinutes' default (1440 = daily).
  # This is a static k8s schedule -- changing valuationIntervalMinutes in the
  # DB does NOT propagate here automatically; update this value + redeploy
  # if the desired cadence changes. See services/api/src/tokenomics-valuation.ts.
  schedule: '0 0 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: tokenomics-valuation
              image: golojan/dialect-api:latest
              command: ['node', 'dist/tokenomics-valuation.js']
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-creds
                      key: connection_string

              # Explicit sizing so this is Burstable, not BestEffort -- an unsized
              # container is the first thing the kernel OOM-kills under node memory
              # pressure, and this node pool is shared with the unrelated `bitocard`
              # namespace. See api-deployment.yaml for the incident this came from.
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi