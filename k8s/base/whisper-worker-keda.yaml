apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: whisper-worker-scaler
spec:
  scaleTargetRef:
    name: whisper-worker
    kind: StatefulSet
  minReplicaCount: 0
  maxReplicaCount: 5
  cooldownPeriod: 120
  pollingInterval: 15
  triggers:
    - type: redis-streams
      metadata:
        address: redis.dai.svc.cluster.local:6379
        stream: asr-jobs-whisper
        consumerGroup: asr-workers-whisper
        lagCount: "1"
        activationLagCount: "0"
