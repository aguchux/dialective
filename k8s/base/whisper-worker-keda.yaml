apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: whisper-worker-scaler
spec:
  scaleTargetRef:
    name: whisper-worker
    kind: StatefulSet
  minReplicaCount: 0
  # NOTE (2026-09-20): do NOT read this group's `lag` as a backlog. Redis
  # reports a stale/unreconcilable lag here (it sat at exactly 5,851 across
  # hours while entries kept being read), and it was misdiagnosed as an ASR
  # capacity problem. The honest signals are `last-delivered-id` vs the
  # stream tail (XREVRANGE ... COUNT 1) and XPENDING -- both showed the
  # group fully caught up, with 1 in-flight entry.
  #
  # If yo/ha/ig recordings are sitting PENDING, check whether they already
  # have a transcript before touching this. They almost certainly do: the
  # PENDING -> SCORED step is driven by peer VALIDATION (word_validations),
  # not by ASR and not by any scorer service, so a validation shortfall
  # looks exactly like a transcription failure from outside.
  #
  # Scaling past 5 also needs nodes: each pod requests 2560Mi and the five
  # DO nodes are 72-96% memory-requested, so a 6th pod sits Pending with
  # "Insufficient memory".
  maxReplicaCount: 5
  cooldownPeriod: 120
  pollingInterval: 15
  triggers:
    - type: redis-streams
      metadata:
        address: redis.dai.svc.cluster.local:6379
        stream: asr-jobs-whisper
        consumerGroup: asr-workers-whisper
        lagCount: "1"
        activationLagCount: "0"
      authenticationRef:
        name: redis-trigger-auth
