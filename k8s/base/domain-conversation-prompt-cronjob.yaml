apiVersion: batch/v1
kind: CronJob
metadata:
  name: domain-conversation-prompt-job
spec:
  # Staggered off word-generator-job's "15 */1 * * *" and settlement-job's
  # "0 */1 * * *" -- prompts are a much lower-volume pool than words/
  # sentences (bounded by domainConversationMaxPromptPoolSize, default 500
  # rows total), so an every-2h cadence is appropriate.
  schedule: "30 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: domain-conversation-prompt-job
              image: golojan/dialect-domain-conversation-prompt-job:latest
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-creds
                      key: connection_string
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: llm-creds
                      key: openai_api_key
                - name: DEEPSEEK_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: llm-creds
                      key: deepseek_api_key
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: llm-creds
                      key: anthropic_api_key
