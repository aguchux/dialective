apiVersion: batch/v1
kind: CronJob
metadata:
  name: word-generator-job
spec:
  # Staggered 15 min off settlement-job's "0 */1 * * *" so both scheduled
  # jobs don't hit the DB in the same instant.
  schedule: "15 */1 * * *" 
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: word-generator-job
              image: golojan/dialect-word-generator-job:latest
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-creds
                      key: connection_string
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: llm-creds
                      key: openai_api_key
                - name: DEEPSEEK_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: llm-creds
                      key: deepseek_api_key
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: llm-creds
                      key: anthropic_api_key
