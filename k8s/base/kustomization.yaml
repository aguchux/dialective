apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # k8s/jobs/prisma-release-job.yaml is intentionally excluded. The manual
  # production release workflow creates it once per image instead of running
  # database migrations during every kustomize apply or API pod restart.
  - redis.yaml
  - postgres.yaml
  - pgadmin.yaml
  - pgadmin-ingress.yaml
  - model-pvc.yaml
  - tts-model-pvc.yaml
  - whisper-model-pvc.yaml
  - api-deployment.yaml
  - api-hpa.yaml
  - api-ingress.yaml
  - vosk-worker-deployment.yaml
  - vosk-worker-keda.yaml
  - whisper-worker-deployment.yaml
  - whisper-worker-keda.yaml
  - quality-gate-worker-deployment.yaml
  - quality-gate-worker-keda.yaml
  - prompt-audio-service-deployment.yaml
  - prompt-audio-service-keda.yaml
  - consensus-scorer-deployment.yaml
  - consensus-scorer-hpa.yaml
  - settlement-cronjob.yaml
  - word-generator-cronjob.yaml
  - fx-rate-cronjob.yaml
  - withdrawal-reconcile-cronjob.yaml
