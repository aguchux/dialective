apiVersion: v1
kind: Service
metadata:
  name: whisper-worker
  labels:
    app: whisper-worker
spec:
  clusterIP: None
  selector:
    app: whisper-worker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: whisper-worker
  labels:
    app: whisper-worker
spec:
  serviceName: whisper-worker
  # KEDA (whisper-worker-keda.yaml) drives replica count off Redis stream
  # lag; this is just the floor when nothing has scaled it yet. KEDA owns
  # this field at runtime, so do not read it as the live replica count.
  replicas: 1
  selector:
    matchLabels:
      app: whisper-worker
  # Each pod gets its OWN PVC via volumeClaimTemplates below instead of one
  # shared ReadWriteOnce PVC -- DigitalOcean's block-storage CSI only
  # supports RWO, so a shared PVC can only ever be attached to one pod's
  # node at a time. Scaling past 1 replica with the old Deployment+shared-
  # PVC setup left every extra pod permanently stuck in ContainerCreating
  # waiting to attach a volume another pod already held (see the 9-day
  # stuck rollout this replaced). /models is a HuggingFace Hub download
  # cache (models--org--name dirs), not shared state each replica needs to
  # see the same copy of -- a per-pod cache that's cold on first boot and
  # warm afterward is the right tradeoff, not a shared filesystem.
  template:
    metadata:
      labels:
        app: whisper-worker
    spec:
      containers:
        - name: whisper-worker
          image: golojan/dialect-whisper-worker:latest
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: whisper-worker-config
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: whisper-worker-config
                  key: redis_port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: ASR_STREAM
              valueFrom:
                configMapKeyRef:
                  name: whisper-worker-config
                  key: asr_stream
            - name: CONSENSUS_STREAM
              valueFrom:
                configMapKeyRef:
                  name: whisper-worker-config
                  key: consensus_stream
            - name: CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: whisper-worker-config
                  key: consumer_group
            - name: SPACES_REGION
              valueFrom:
                configMapKeyRef:
                  name: whisper-worker-config
                  key: spaces_region
            - name: SPACES_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: endpoint
            - name: SPACES_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: access_key
            - name: SPACES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: secret_key
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-creds
                  key: hf_token
            - name: API_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-creds
                  key: api_token_encryption_key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: connection_string
          resources:
            # Sized around observed usage -- an eviction incident on
            # 2026-08-23 found a single instance at ~2.7Gi with no limit set,
            # which drove its node into MemoryPressure and evicted ~30
            # replica pods it had spawned trying to reschedule. The request
            # gives normal operation (model load + inference) headroom above
            # that observed figure; the limit caps a leak/runaway so it gets
            # OOMKilled on its own instead of taking the whole node down.
            requests:
              cpu: 500m
              memory: 2560Mi
            limits:
              cpu: "2"
              memory: 3584Mi
          volumeMounts:
            - name: whisper-model-repo
              mountPath: /models
              readOnly: false
  volumeClaimTemplates:
    - metadata:
        name: whisper-model-repo
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # 30Gi, raised from 5Gi on 2026-09-20 when asr-registry.yaml
            # went from 3 whisper checkpoints to 14. The registry's models
            # now total ~22GB on disk (Shona's is a large-v3 at 6.2GB,
            # Zulu and Darija are mediums at 3.1GB each); 5Gi was already
            # 60% full holding just the three NCAIR1 models.
            #
            # A worker caches every checkpoint it is asked for, so this
            # must fit ALL of them, not the largest -- an out-of-space
            # /models does not degrade to "that dialect is unsupported",
            # it breaks the download for whatever dialect is next,
            # including ones that work today.
            #
            # Existing PVCs were expanded in place (do-block-storage has
            # allowVolumeExpansion: true); volumeClaimTemplates is
            # immutable on a StatefulSet, so this line only governs
            # newly-created replicas.
            storage: 30Gi
        storageClassName: do-block-storage
