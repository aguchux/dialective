apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  labels:
    app: pgadmin
spec:
  selector:
    app: pgadmin
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  labels:
    app: pgadmin
spec:
  replicas: 1
  # RollingUpdate (the default) briefly runs old+new pods together, but
  # pgadmin-data-pvc is ReadWriteOnce -- the new pod can never attach the
  # volume while the old one holds it, deadlocking any rollout (confirmed
  # live: FailedAttachVolume "Multi-Attach error", old pod CrashLoopBackOff,
  # new pod stuck ContainerCreating indefinitely). Recreate tears down the
  # old pod first so the volume is free before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      # dpage/pgadmin4 runs as uid 5050 / gid 0 (root group) -- without fsGroup
      # the mounted PVC is owned by root:root with no group-write, so pgadmin
      # can't create /var/lib/pgadmin/sessions. fsGroup must match the
      # container's actual gid (0), confirmed via `kubectl run ... -- id`.
      securityContext:
        fsGroup: 0
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pgadmin-creds
                  key: email
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgadmin-creds
                  key: password
            - name: PGADMIN_LISTEN_PORT
              valueFrom:
                configMapKeyRef:
                  name: pgadmin-config
                  key: pgadmin_listen_port
          volumeMounts:
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
          # 15 restarts (all exit 137) -- by far the worst offender in the
          # namespace, and the least important workload in it. An admin
          # convenience tool was being killed repeatedly while competing for
          # unreserved memory against postgres, redis and the api.
          #
          # Measured ~257Mi. A tight limit here is deliberate: this is the
          # one workload that SHOULD lose a memory fight, so capping it at
          # 512Mi protects the database and api from it rather than the other
          # way round.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: pgadmin-data
          persistentVolumeClaim:
            claimName: pgadmin-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgadmin-data-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
  storageClassName: do-block-storage
