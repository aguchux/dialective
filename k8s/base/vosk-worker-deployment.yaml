apiVersion: apps/v1
kind: Deployment
metadata:
  name: vosk-worker
  labels:
    app: vosk-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: vosk-worker
  template:
    metadata:
      labels:
        app: vosk-worker
    spec:
      # Populates asr-model-repo-pvc with the Vosk model on first mount --
      # idempotent (skips the download if the model dir already exists), so
      # this is cheap on every subsequent pod start including scale-from-zero.
      # Model weights are NOT baked into the vosk-worker image (see its
      # Dockerfile) specifically so every replica shares this one PVC-backed
      # copy instead of re-downloading per image build.
      initContainers:
        - name: fetch-model
          image: python:3.11-slim
          command:
            - sh
            - -c
            - |
              set -e
              if [ -d /models/vosk-model-small-en-us-0.15 ]; then
                echo "model already present, skipping download"
                exit 0
              fi
              apt-get update && apt-get install -y wget unzip
              wget -O /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
              unzip /tmp/model.zip -d /models
              rm /tmp/model.zip
          volumeMounts:
            - name: model-repo
              mountPath: /models
      containers:
        - name: vosk-worker
          image: golojan/dialect-vosk-worker:latest
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: vosk-worker-config
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: vosk-worker-config
                  key: redis_port
            - name: ASR_STREAM
              valueFrom:
                configMapKeyRef:
                  name: vosk-worker-config
                  key: asr_stream
            - name: CONSENSUS_STREAM
              valueFrom:
                configMapKeyRef:
                  name: vosk-worker-config
                  key: consensus_stream
            - name: CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: vosk-worker-config
                  key: consumer_group
            - name: SPACES_REGION
              valueFrom:
                configMapKeyRef:
                  name: vosk-worker-config
                  key: spaces_region
            - name: SPACES_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: endpoint
            - name: SPACES_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: access_key
            - name: SPACES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spaces-creds
                  key: secret_key
          volumeMounts:
            - name: model-repo
              mountPath: /models
              readOnly: true
      volumes:
        - name: model-repo
          persistentVolumeClaim:
            claimName: asr-model-repo-pvc
