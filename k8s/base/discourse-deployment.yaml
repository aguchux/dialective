apiVersion: v1
kind: Service
metadata:
  name: discourse
  labels:
    app: discourse
spec:
  selector:
    app: discourse
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discourse
  labels:
    app: discourse
spec:
  replicas: 1
  # bitnami/discourse writes uploads/assets to its own PVC (ReadWriteOnce) --
  # same Recreate-vs-RollingUpdate deadlock risk as pgadmin.yaml (Multi-Attach
  # error, new pod stuck ContainerCreating while the old one still holds the
  # volume). Recreate tears the old pod down first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: discourse
  template:
    metadata:
      labels:
        app: discourse
    spec:
      # bitnami images run as a non-root uid with gid 0; without fsGroup the
      # mounted PVC is root-owned with no group-write and Discourse's own
      # first-boot migration can't create its data dirs (same class of issue
      # documented in pgadmin.yaml).
      securityContext:
        fsGroup: 1001
      initContainers:
        # Discourse's own boot process runs `rails db:migrate` on startup, but
        # needs the target database/role to already exist. bitnami's
        # postgresql image auto-creates POSTGRESQL_DATABASE/USERNAME on first
        # boot of discourse-postgres itself, so this just waits for that
        # StatefulSet to be reachable before the app container starts, rather
        # than crash-looping through Postgres's own startup window.
        - name: wait-for-postgres
          image: bitnami/postgresql:15
          command:
            - sh
            - -c
            - |
              until pg_isready -h discourse-postgres -p 5432 -U "$POSTGRESQL_USERNAME"; do
                echo "waiting for discourse-postgres..."
                sleep 3
              done
          env:
            - name: POSTGRESQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: discourse-postgres-creds
                  key: username
      containers:
        - name: discourse
          image: bitnami/discourse:3
          ports:
            - containerPort: 3000
          env:
            - name: DISCOURSE_HOST
              valueFrom:
                configMapKeyRef:
                  name: discourse-config
                  key: discourse_host
            - name: DISCOURSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: discourse-creds
                  key: admin_username
            - name: DISCOURSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discourse-creds
                  key: admin_password
            - name: DISCOURSE_EMAIL
              valueFrom:
                secretKeyRef:
                  name: discourse-creds
                  key: admin_email
            - name: DISCOURSE_DATABASE_HOST
              value: discourse-postgres
            - name: DISCOURSE_DATABASE_PORT_NUMBER
              value: "5432"
            - name: DISCOURSE_DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: discourse-postgres-config
                  key: postgres_db
            - name: DISCOURSE_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: discourse-postgres-creds
                  key: username
            - name: DISCOURSE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discourse-postgres-creds
                  key: password
            - name: DISCOURSE_REDIS_HOST
              value: discourse-redis
            - name: DISCOURSE_REDIS_PORT_NUMBER
              value: "6379"
            - name: DISCOURSE_SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: discourse-config
                  key: smtp_host
            - name: DISCOURSE_SMTP_PORT_NUMBER
              valueFrom:
                configMapKeyRef:
                  name: discourse-config
                  key: smtp_port
            - name: DISCOURSE_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: discourse-creds
                  key: smtp_user
            - name: DISCOURSE_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discourse-creds
                  key: smtp_password
            - name: DISCOURSE_SMTP_PROTOCOL
              value: tls
            - name: DISCOURSE_SMTP_FROM_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: discourse-config
                  key: smtp_from_address
            # DiscourseConnect (SSO) -- delegates all login/registration to
            # frontend's /api/discourse-sso route (NextAuth session), so
            # Discourse never owns a password for any Dialect Library user.
            # sso_provider_secret must match auth-creds' discourse_sso_secret
            # exactly (shared HMAC key) -- see frontend/app/api/discourse-sso/route.ts.
            - name: DISCOURSE_ENABLE_SSO
              value: "true"
            - name: DISCOURSE_SSO_URL
              valueFrom:
                configMapKeyRef:
                  name: discourse-config
                  key: sso_url
            - name: DISCOURSE_SSO_SECRET
              valueFrom:
                secretKeyRef:
                  name: discourse-creds
                  key: sso_secret
            - name: DISCOURSE_SSO_OVERRIDES_EMAIL
              value: "true"
            - name: DISCOURSE_SSO_OVERRIDES_USERNAME
              value: "false"
            - name: DISCOURSE_SSO_OVERRIDES_NAME
              value: "true"
          volumeMounts:
            - name: discourse-data
              mountPath: /bitnami/discourse
          readinessProbe:
            httpGet:
              path: /srv/status
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /srv/status
              port: 3000
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "500m"
              memory: "1.5Gi"
            limits:
              memory: "3Gi"
      volumes:
        - name: discourse-data
          persistentVolumeClaim:
            claimName: discourse-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: discourse-data-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
  storageClassName: do-block-storage
