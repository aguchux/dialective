# Local-dev-only LiveKit server config. Do not reuse these keys/secrets
# outside local development -- see chatdialect/.env.example's LIVEKIT_*
# vars, which must match what's declared here.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
keys:
  devkey: devsecret_at_least_32_characters_long
